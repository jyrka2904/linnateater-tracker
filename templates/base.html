<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Linnateater Tracker{% endblock %}</title>
  <style>
    :root{
      --paper:#f1eee8;
      --white:#fff;
      --ink:#111111;
      --muted:#77736d;
      --red:#e41f26;
      --line:#d9d4cc;
      --soft:#e9e5de;
      --green:#17643d;
      --shadow:0 18px 50px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--paper);
      color:var(--ink);
      letter-spacing:-.015em;
    }
    a{color:inherit}
    button,input,select{font:inherit}
    .shell{max-width:1320px;margin:0 auto;padding:0 30px 70px}
    .header{
      min-height:104px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--ink);
    }
    .wordmark{
      display:flex;align-items:center;gap:15px;
      font-weight:900;font-size:25px;letter-spacing:-.045em;
      text-transform:uppercase;
    }
    .mark{
      width:37px;height:37px;border-radius:50%;
      background:var(--red);display:grid;place-items:center;color:white;
      font-weight:900;font-size:21px;
    }
    .header-right{display:flex;gap:18px;align-items:center}
    .phone{font-size:13px;color:var(--muted)}
    .ghost{
      border:1px solid var(--ink);background:transparent;color:var(--ink);
      border-radius:0;padding:11px 16px;font-weight:700;cursor:pointer;
    }
    .hero{
      padding:58px 0 40px;
      display:grid;
      grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);
      gap:50px;align-items:end;
    }
    .eyebrow{
      font-size:12px;text-transform:uppercase;letter-spacing:.18em;
      font-weight:800;margin-bottom:16px;color:var(--red);
    }
    h1{
      font-size:clamp(48px,7vw,94px);
      line-height:.91;margin:0;letter-spacing:-.07em;
      font-weight:900;max-width:850px;
    }
    .hero-copy{font-size:18px;line-height:1.45;max-width:430px;color:#4f4c47}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px}
    .panel{
      background:var(--white);
      border-top:5px solid var(--ink);
      padding:28px;
      box-shadow:var(--shadow);
    }
    .panel.red{border-top-color:var(--red)}
    .panel h2{
      font-size:30px;line-height:1;margin:0 0 8px;
      letter-spacing:-.045em;
    }
    .intro{color:var(--muted);line-height:1.45;margin:0 0 28px}
    .step{margin-top:22px}
    label{
      display:block;text-transform:uppercase;font-size:11px;
      letter-spacing:.13em;font-weight:800;margin-bottom:8px;
    }
    select{
      width:100%;height:56px;border:1px solid var(--ink);
      border-radius:0;padding:0 15px;background:#fff;color:var(--ink);
      appearance:auto;
    }
    select:disabled{color:#9b9690;background:#f7f5f1}
    .performance-list{display:grid;gap:10px;margin-top:12px}
    .performance-option{
      border:1px solid var(--line);background:#fff;padding:0;
      display:grid;grid-template-columns:22px 1fr auto;
      gap:14px;align-items:center;text-align:left;
      min-height:66px;padding:13px 15px;cursor:pointer;
      transition:.15s ease;
    }
    .performance-option:hover{border-color:var(--ink)}
    .performance-option.selected{
      border-color:var(--ink);box-shadow:inset 4px 0 0 var(--red);
    }
    .radio{
      width:18px;height:18px;border:1px solid var(--ink);border-radius:50%;
      position:relative;
    }
    .selected .radio:after{
      content:"";position:absolute;inset:4px;border-radius:50%;background:var(--red)
    }
    .perf-date{font-weight:800;font-size:16px}
    .perf-status{
      font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;
      padding:6px 8px;background:#eeeae4;
    }
    .perf-status.sold{background:#191919;color:white}
    .perf-status.available{background:#e5f1e9;color:var(--green)}
    .primary{
      width:100%;border:0;background:var(--red);color:#fff;
      min-height:58px;padding:0 18px;font-weight:900;text-transform:uppercase;
      letter-spacing:.07em;cursor:pointer;margin-top:18px;
    }
    .primary:disabled{background:#bcb7b0;cursor:not-allowed}
    .loading,.empty{
      border:1px dashed var(--line);padding:18px;color:var(--muted);
      margin-top:10px;font-size:14px;
    }
    .side-stat{border-bottom:1px solid var(--line);padding:18px 0}
    .side-stat:first-of-type{padding-top:4px}
    .side-stat:last-child{border-bottom:0}
    .big-number{font-size:48px;letter-spacing:-.06em;font-weight:900}
    .small{font-size:13px;color:var(--muted);line-height:1.5}
    .section-head{
      margin:52px 0 19px;display:flex;align-items:end;justify-content:space-between;
      border-bottom:1px solid var(--ink);padding-bottom:13px;
    }
    .section-head h2{margin:0;font-size:34px;letter-spacing:-.045em}
    .count{font-size:12px;text-transform:uppercase;letter-spacing:.12em}
    .trackers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .tracker{
      background:#fff;display:grid;grid-template-columns:210px 1fr;min-height:250px;
      box-shadow:var(--shadow);overflow:hidden;
    }
    .tracker-image{
      background:#d8d4cc;min-height:250px;position:relative;overflow:hidden;
    }
    .tracker-image img{
      width:100%;height:100%;object-fit:cover;position:absolute;inset:0;
      filter:saturate(.82) contrast(1.02);
    }
    .fallback{
      position:absolute;inset:0;display:grid;place-items:center;
      font-size:48px;font-weight:900;color:#7e7972;
    }
    .tracker-body{padding:24px;display:flex;flex-direction:column}
    .tracker-title{
      font-size:27px;line-height:1.02;font-weight:900;letter-spacing:-.05em;
      margin:0 0 10px;
    }
    .date{font-size:17px;font-weight:700;margin-bottom:18px}
    .state{
      display:inline-flex;align-items:center;gap:8px;font-size:12px;
      text-transform:uppercase;letter-spacing:.08em;font-weight:800;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .dot.error{background:var(--red)}
    .tracker-actions{
      margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;
      align-items:center;border-top:1px solid var(--line);
    }
    .buy-link{font-size:13px;font-weight:800;text-decoration:none}
    .delete{
      border:0;background:transparent;color:#777;padding:7px;cursor:pointer;
      text-decoration:underline;text-underline-offset:3px;
    }
    .flash{
      margin:0 0 18px;padding:15px 17px;border-left:5px solid var(--red);
      background:#fff;
    }
    .flash.success{border-left-color:var(--green)}
    .error-text{color:#aa1620}
    .auth{
      max-width:520px;margin:12vh auto 0;background:white;
      padding:42px;border-top:6px solid var(--red);box-shadow:var(--shadow)
    }
    .auth h1{font-size:54px;margin:25px 0 15px}
    .auth input{
      width:100%;height:56px;border:1px solid var(--ink);
      border-radius:0;padding:0 15px;
    }
    @media(max-width:980px){
      .hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
      .trackers{grid-template-columns:1fr}.tracker{grid-template-columns:180px 1fr}
    }
    @media(max-width:620px){
      .shell{padding:0 16px 50px}.header{min-height:82px}
      .phone{display:none}.hero{padding:38px 0 28px}
      .tracker{grid-template-columns:1fr}.tracker-image{min-height:230px}
      .panel{padding:20px}.auth{margin-top:5vh;padding:28px}
    }
  </style>
</head>
<body>
  <div class="shell">{% block body %}{% endblock %}</div>
</body>
</html>
