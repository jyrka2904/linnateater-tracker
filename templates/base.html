<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111112">
  <title>{% block title %}Piletivaht{% endblock %}</title>
  
  <style>
    :root{
      --bg:#CFCFD3;
      --shell:#F6F1EA;
      --shell-2:#FBF8F4;
      --ink:#161619;
      --ink-soft:#4e535f;
      --line:#E6DED2;
      --line-2:rgba(255,255,255,.08);
      --card:#FFFFFF;
      --card-dark:#111827;
      --chip:#0E1420;
      --accent:#D3AD67;
      --accent-2:#D18D2D;
      --green:#28B06F;
      --orange:#F1A93B;
      --red:#E65A56;
      --shadow:0 30px 70px rgba(18,20,26,.18);
      --radius-xl:20px;
      --radius-lg:16px;
      --radius-md:12px;
    }
    *{box-sizing:border-box}
    html{background:radial-gradient(circle at top left, rgba(255,255,255,.8), transparent 32%), #d7d8dd;scroll-behavior:smooth}
    body{margin:0;background:transparent;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .site{min-height:100vh;padding:18px}
    .app-shell{max-width:1460px;margin:0 auto;background:linear-gradient(180deg,var(--shell) 0%, #f8f3ec 100%);border:1px solid rgba(255,255,255,.72);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .page-wrap{padding:18px 18px 24px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(90deg,#0f1421 0%, #151b29 72%, #171d2e 100%);padding:13px 18px;border-radius:14px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
    .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
    .logo-icon{width:28px;height:28px;display:block;flex:0 0 auto}
    .logo-stack{display:flex;flex-direction:column;gap:2px;line-height:1}
    .logo-stack strong{font-family:Georgia, 'Times New Roman', serif;font-size:17px;font-weight:700;letter-spacing:-.03em}
    .logo-stack small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.66)}
    .main-nav{display:flex;gap:4px;align-items:center}
    .main-nav a{font-size:12px;text-decoration:none;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.68)}
    .main-nav a:hover,.main-nav a.active{color:#fff;background:rgba(255,255,255,.08)}
    .nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:#151619;font-size:10px;font-weight:800;margin-left:6px}
    .top-actions{display:flex;gap:10px;align-items:center}
    .avatar-badge{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;font-weight:700}
    .account-label{font-size:12px;color:rgba(255,255,255,.72)}
    .nav-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;border-radius:10px;padding:9px 12px;font-size:12px}
    .main{padding:14px 0 0}
    .hero-stage{position:relative;overflow:hidden;border-radius:16px;min-height:290px;padding:34px 30px 26px;background:#121827 url('{{ url_for("static", filename="hero-stage.svg") }}') center/cover no-repeat;color:#fff}
    .hero-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,16,24,.84) 0%, rgba(13,16,24,.48) 46%, rgba(13,16,24,.08) 100%)}
    .hero-stage > *{position:relative;z-index:1}
    .hero-copy-wrap{max-width:560px}
    .hero-kicker{font-size:12px;color:rgba(255,255,255,.66);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
    .hero-stage h1{margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:54px;line-height:.96;letter-spacing:-.03em;font-weight:700}
    .hero-sub{margin:0 0 18px;color:rgba(255,255,255,.82);font-size:17px}
    .hero-search{width:min(580px,100%);display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;border-radius:14px;background:rgba(16,21,34,.62);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
    .hero-search input{width:100%;background:transparent;border:0;outline:none;color:#fff}
    .hero-search svg{width:16px;height:16px;stroke:#9aa4b4}
    .hero-search input::placeholder{color:#8992a2}
    .filter-ribbon{display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr;gap:10px;padding:12px;margin-top:-22px;position:relative;z-index:3;background:linear-gradient(180deg,#1d2434 0%, #131927 100%);border-radius:14px;box-shadow:0 18px 36px rgba(17,20,28,.18)}
    .filter-box{display:flex;flex-direction:column;gap:6px}
    .filter-box label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8f98a7;font-weight:700}
    .filter-control{height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;padding:0 12px;outline:none}
    .filter-control::placeholder{color:#97A0AF}
    .filter-action{display:flex;align-items:end}
    .filter-reset{height:42px;width:100%;border:0;border-radius:12px;background:linear-gradient(180deg,#e0bc7b 0%, #c7994b 100%);color:#171617;font-weight:800}
    .content-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:14px}
    .panel{background:var(--shell-2);border:1px solid var(--line);border-radius:16px;padding:16px}
    .panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .panel-title{display:flex;align-items:baseline;gap:10px}
    .panel-title h2{margin:0;font-family:Georgia, 'Times New Roman', serif;font-size:19px;font-weight:700}
    .panel-badge{padding:4px 8px;border-radius:999px;background:#f0e7da;font-size:11px;color:#6b6254}
    .panel-tools{display:flex;gap:8px;align-items:center;color:#7b7267;font-size:12px}
    .tool-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .production-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .production-card{position:relative;border:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(18,20,26,.06);color:var(--ink);text-align:left}
    .production-card[hidden]{display:none}
    .production-thumb-wrap{position:relative;aspect-ratio:1.48;overflow:hidden;background:#cfd3da}
    .production-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .production-card:hover .production-thumb{transform:scale(1.02)}
    .production-thumb{transition:transform .35s ease}
    .production-chip{position:absolute;left:10px;top:10px;z-index:2;padding:4px 9px;border-radius:999px;background:rgba(7,11,19,.88);color:#fff;font-size:10px;font-weight:700}
    .production-body{padding:11px 12px 12px}
    .production-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .production-title{font-size:18px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0}
    .fav-icon{width:18px;height:18px;border:1px solid #d8d1c7;border-radius:999px;display:grid;place-items:center;color:#7a7469;font-size:11px;flex:0 0 auto}
    .production-meta{margin-top:6px;color:#6d6559;font-size:12px;line-height:1.5}
    .status-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700}
    .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
    .status-available{color:var(--green)}
    .status-limited{color:var(--orange)}
    .status-soldout{color:var(--red)}
    .dot.green{background:var(--green)} .dot.orange{background:var(--orange)} .dot.red{background:var(--red)}
    .sidebar-card{background:linear-gradient(180deg,#fff 0%, #fcf8f2 100%);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 22px rgba(18,20,26,.06)}
    .sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .sidebar-head h3{margin:0;font-family:Georgia, 'Times New Roman', serif;font-size:21px;font-weight:700}
    .tracker-mini-list{display:flex;flex-direction:column;gap:10px}
    .tracker-mini{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #efe6da}
    .tracker-mini:last-child{border-bottom:0}
    .tracker-mini img{width:46px;height:58px;object-fit:cover;border-radius:10px;display:block;background:#d9d9de}
    .tracker-mini-title{font-size:13px;font-weight:800;line-height:1.2;margin-bottom:3px}
    .tracker-mini-meta{font-size:11px;color:#776f63;line-height:1.4}
    .tracker-mini-status{font-size:11px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:6px}
    .sidebar-cta{margin-top:12px;display:block;width:100%;text-align:center;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#ecd4a4 0%, #ddb66a 100%);color:#171617;text-decoration:none;font-weight:800}
    .support-block{margin-top:14px;padding-top:14px;border-top:1px solid #eee4d5}
    .support-block h4{margin:0 0 10px;font-size:14px;color:#595145}
    .theatre-logos{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:#484035;font-size:12px}
    .theatre-logo{padding:10px;border:1px dashed #d9cfbf;border-radius:12px;background:#fff}
    .tracker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .tracker-card{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(18,20,26,.05)}
    .tracker-card[hidden]{display:none}
    .tracker-card img{width:80px;height:100px;object-fit:cover;border-radius:10px;background:#d9dbe2}
    .tracker-inner{display:block}
    .tracker-theatre{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#10141E;color:#fff;font-size:10px;margin-bottom:8px}
    .tracker-title{margin:0;font-size:18px;line-height:1.05;letter-spacing:-.03em}
    .tracker-date{font-size:12px;color:#655d51;margin-top:6px}
    .tracker-meta{font-size:12px;color:#8a8175;margin-top:6px}
    .tracker-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
    .tracker-actions form{margin:0}
    .external{text-decoration:none;font-size:12px;font-weight:700;color:#394354}
    .remove{border:0;background:none;color:#a45b57;font-size:12px;font-weight:700;padding:0}
    .status-pill{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#3f4b3f;margin-bottom:10px}
    .status-dot{width:8px;height:8px;background:var(--green);border-radius:999px;display:inline-block}.status-dot.error{background:var(--red)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(11,14,22,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(10px)}
    .modal-backdrop.open{display:flex}
    .modal{position:relative;width:min(1180px,96vw);max-height:92vh;display:grid;grid-template-columns:340px minmax(0,1fr);background:#111827;border-radius:18px;color:#fff;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
    .modal-close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:24px}
    .modal-visual{position:relative;min-height:580px;background:#1f2937}
    .modal-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .modal-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,20,.05),rgba(11,15,20,.74))}
    .modal-name{position:absolute;left:22px;right:22px;bottom:22px;z-index:1;font-size:42px;line-height:.94;letter-spacing:-.05em;font-weight:800}
    .modal-body{padding:28px;overflow:auto}
    .modal-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#98a1b1;margin-bottom:10px}
    .modal-title{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:30px}
    .modal-sub{color:#aeb4bf;font-size:13px;line-height:1.5;margin:10px 0 18px}
    .performance-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .performance-option{border:1px solid rgba(255,255,255,.12);background:#0e1420;color:#fff;border-radius:12px;padding:16px;text-align:left}
    .performance-option.selected{border-color:#d0aa63;background:#191f2d;box-shadow:inset 0 0 0 1px #d0aa63}
    .perf-date{display:block;font-size:18px;font-weight:800;line-height:1.15}
    .perf-status{display:block;margin-top:8px;font-size:12px;color:#98a1b1}
    .watch-btn{border:0;border-radius:12px;background:linear-gradient(180deg,#e0bc7b 0%, #c7994b 100%);color:#171617;padding:13px 18px;font-weight:800}
    .modal-footer{display:flex;gap:12px;align-items:center;margin-top:20px}
    .picker-msg{color:#9ea6b4;font-size:13px}
    .flash-stack{margin:10px 0 0}
    .flash{padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;margin-bottom:10px}
    .flash.error{border-color:#f0d0d0}.flash.success{border-color:#d6eddc}
    .section-note,.filter-help,.catalog-empty,.empty-state,.grid-count{font-size:13px;color:#786f63}
    .auth-page{min-height:100vh;background:linear-gradient(135deg,#d6d7dc 0%, #ececf0 50%, #d2d3d8 100%);display:grid;place-items:center;padding:24px}
    .auth-shell{width:min(1400px,100%);background:linear-gradient(180deg,var(--shell) 0%, #f7f2eb 100%);border-radius:22px;box-shadow:var(--shadow);padding:18px}
    .auth-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);border-radius:18px;overflow:hidden}
    .auth-art{position:relative;min-height:760px;background:linear-gradient(180deg,#141b28 0%, #10141f 55%, #1d2737 100%);padding:32px;color:#fff}
    .auth-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 24%), linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));opacity:.8}
    .auth-art > *{position:relative;z-index:1}
    .auth-art .logo{color:#fff}
    .auth-art h1{margin:120px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(64px,8vw,118px);line-height:.88;letter-spacing:-.05em;font-weight:700;max-width:680px}
    .auth-art h1 .hero-sentence,.auth-art h1 .hero-second{display:block}
    .auth-art h1 .hero-second{margin-top:.26em}
    .auth-fine{position:absolute;left:32px;bottom:28px;max-width:340px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.55}
    .auth-panel{display:grid;place-items:center;background:transparent;padding:24px}
    .auth-box{width:min(100%,560px);padding:40px;background:rgba(255,253,250,.96);border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 25px 60px rgba(0,0,0,.08)}
    .auth-copy{font-size:16px;color:#6b706f;line-height:1.5}
    .auth-form label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#5d605f}
    .field{width:100%;height:56px;border-radius:14px;border:1px solid #d9d6cf;background:#eef2fa;padding:0 14px;outline:none;margin-top:10px}
    .field:focus{border-color:#c7994b;box-shadow:0 0 0 4px rgba(199,153,75,.12)}
    .primary-btn{width:100%;height:54px;border-radius:999px;border:0;background:#111827;color:#fff;font-weight:800;margin-top:16px}
    .link-row{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;color:#666b6f}

    .auth-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#c9904e;font-weight:800;margin-bottom:10px}
    .auth-caption{position:absolute;left:32px;bottom:28px;max-width:340px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.55}
    .auth-box h2{margin:0 0 10px;font-family:Georgia,'Times New Roman',serif;font-size:54px;line-height:.95;letter-spacing:-.05em}
    .field{display:flex;flex-direction:column;gap:8px;height:auto;padding:0;margin-top:14px;background:transparent;border:0}
    .field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#5d605f}
    .field input{width:100%;height:56px;border-radius:14px;border:1px solid #d9d6cf;background:#eef2fa;padding:0 14px;outline:none}
    .field input:focus{border-color:#c7994b;box-shadow:0 0 0 4px rgba(199,153,75,.12)}
    .check-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:#64696c}
    .auth-primary{width:100%;height:54px;border-radius:999px;border:0;background:#111827;color:#fff;font-weight:800;margin-top:16px}
    .auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;color:#666b6f}
    @media(max-width:1200px){.production-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}.sidebar-col{order:2}.tracker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:860px){.topbar{flex-wrap:wrap}.main-nav{order:3;width:100%;justify-content:flex-start}.hero-stage{min-height:250px;padding:24px}.hero-stage h1{font-size:40px}.filter-ribbon{grid-template-columns:1fr 1fr;margin-top:12px}.production-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tracker-grid{grid-template-columns:1fr}.modal{grid-template-columns:1fr}.modal-visual{min-height:260px}.auth-grid{grid-template-columns:1fr}.auth-art{min-height:420px}.auth-art h1{margin-top:72px;font-size:58px}.auth-fine{position:relative;left:auto;bottom:auto;margin-top:26px}}
    @media(max-width:560px){.site{padding:10px}.page-wrap{padding:10px}.filter-ribbon{grid-template-columns:1fr}.production-grid{grid-template-columns:1fr}.hero-stage h1{font-size:34px}.top-actions .account-label{display:none}}
  </style>

  {% block head %}{% endblock %}
</head>
<body>
{% block layout %}
<div class="site">
  <div class="app-shell"><div class="page-wrap">{% block body %}{% endblock %}</div></div>
</div>
{% endblock %}
</body>
</html>
