<!doctype html>
<html lang="et-EE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111112">
  <title>{% block title %}Piletivaht{% endblock %}</title>
  <style>
    :root{
      --paper:#efede8;
      --paper-2:#e8e5de;
      --ink:#0a0a0a;
      --red:#ee2b35;
      --white:#fff;
      --muted:#69655f;
      --line:rgba(10,10,10,.18);
      --green:#167347;
      --orange:#b45b18;
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper)}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    button,input{font:inherit}
    button{cursor:pointer}
    .site{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;
      min-height:78px;padding:0 clamp(18px,4vw,58px);
      background:rgba(239,237,232,.92);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(10,10,10,.22);
    }
    .logo{
      display:flex;align-items:center;gap:11px;text-decoration:none;
      font-weight:950;font-size:18px;letter-spacing:-.045em;
    }
    .logo-mark{
      width:30px;height:30px;background:var(--red);border-radius:50%;
      display:grid;place-items:center;color:#fff;font-weight:950;
    }
    .top-actions{display:flex;align-items:center;gap:14px}
    .main-nav{display:flex;align-items:center;gap:4px}
    .main-nav a{
      text-decoration:none;padding:10px 13px;border-radius:999px;
      font-size:11px;font-weight:900;text-transform:uppercase;
      letter-spacing:.07em;
    }
    .main-nav a:hover,.main-nav a.active{background:var(--ink);color:#fff}
    .nav-count{
      display:inline-grid;place-items:center;min-width:19px;height:19px;
      padding:0 5px;border-radius:999px;background:var(--red);color:#fff;
      margin-left:5px;font-size:9px;
    }
    .account-label{font-size:12px;color:var(--muted)}
    .nav-btn{
      border:1px solid var(--ink);background:transparent;color:var(--ink);
      border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;
    }
    .main{
      max-width:1500px;margin:0 auto;
      padding:0 clamp(18px,4vw,58px) 80px;
    }
    .hero{
      display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);
      gap:50px;align-items:end;padding:62px 0 58px;
      border-bottom:1px solid var(--ink);
    }
    .kicker{
      text-transform:uppercase;letter-spacing:.17em;font-size:11px;
      font-weight:900;color:var(--red);margin-bottom:17px;
    }
    .hero h1{
      margin:0;font-size:clamp(58px,8.5vw,132px);
      line-height:.79;letter-spacing:-.085em;font-weight:950;
      max-width:1000px;
    }
    .hero-copy{
      font-size:18px;line-height:1.45;letter-spacing:-.02em;
      max-width:410px;margin:0 0 7px;
    }
    .hero-copy strong{font-weight:900}
    .flash-stack{margin-top:24px}
    .flash{
      padding:15px 18px;border:1px solid var(--ink);
      background:#fff;margin-bottom:10px;font-size:14px;
      display:flex;gap:10px;align-items:center;
    }
    .flash:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
    .flash.success:before{background:var(--green)}
    .flash.notice:before{background:var(--orange)}
    .section{
      padding:54px 0;border-bottom:1px solid var(--ink);
    }
    .section-title-row{
      display:flex;align-items:end;justify-content:space-between;gap:20px;
      margin-bottom:24px;
    }
    .section-title{
      margin:0;font-size:clamp(34px,4vw,58px);
      line-height:.92;letter-spacing:-.06em;font-weight:950;
    }
    .section-note{font-size:13px;color:var(--muted);max-width:360px;line-height:1.45}
    .search-row{
      display:flex;align-items:center;gap:12px;margin-bottom:24px;
    }
    .search{
      width:100%;height:54px;background:transparent;border:0;
      border-bottom:1px solid var(--ink);border-radius:0;padding:0 2px;
      font-size:19px;outline:none;
    }
    .production-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
    }
    .production-card{
      position:relative;aspect-ratio:.78;overflow:hidden;border:0;padding:0;
      background:#d8d4cd;text-align:left;color:#fff;border-radius:4px;
      transform:translateZ(0);
    }
    .production-card[hidden]{display:none}
    .production-card img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      transition:transform .35s ease;
    }
    .production-card:hover img{transform:scale(1.025)}
    .production-card:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.86) 4%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.04));
    }
    .production-card.active{
      outline:5px solid var(--red);outline-offset:-5px;
    }
    .production-graphic{
      position:absolute;inset:0;display:grid;place-items:center;
      color:#77716a;background:#d8d4cd;
      font-size:clamp(58px,7vw,105px);line-height:1;
      letter-spacing:-.09em;font-weight:950;
    }
    .production-content{
      position:absolute;z-index:2;left:18px;right:18px;bottom:17px;
    }
    .production-index{
      display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
      font-weight:900;margin-bottom:8px;opacity:.78;
    }
    .production-title{
      display:block;font-size:clamp(19px,2vw,31px);line-height:.95;
      letter-spacing:-.05em;font-weight:950;
    }
    .image-skeleton{
      position:absolute;inset:0;background:#242424;
    }

    .modal-backdrop{
      position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
      display:none;align-items:center;justify-content:center;
      padding:22px;backdrop-filter:blur(8px);
    }
    .modal-backdrop.open{display:flex}
    .modal{
      position:relative;width:min(1120px,96vw);max-height:92vh;
      background:var(--ink);color:#fff;overflow:hidden;
      display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);
      box-shadow:0 40px 120px rgba(0,0,0,.38);
    }
    .modal-close{
      position:absolute;z-index:5;top:15px;right:15px;
      width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.55);
      background:rgba(0,0,0,.28);color:#fff;font-size:22px;
      display:grid;place-items:center;
    }
    .modal-visual{
      position:relative;
      min-height:0;
      background:#d8d4cd;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-self:start;
    }
    .modal-visual img{
      position:relative;
      inset:auto;
      width:100%;
      height:auto;
      max-height:68vh;
      display:block;
      object-fit:contain;
      object-position:center;
      background:transparent;
      flex:0 0 auto;
    }
    .modal-visual:after{
      content:none;
    }
    .modal-name{
      position:relative;
      z-index:2;
      left:auto;
      right:auto;
      bottom:auto;
      width:100%;
      padding:22px 28px 24px;
      background:#d8d4cd;
      color:#fff;
      font-size:clamp(30px,3.4vw,52px);
      line-height:.94;
      letter-spacing:-.05em;
      font-weight:950;
      text-shadow:0 2px 12px rgba(0,0,0,.52);
      overflow-wrap:anywhere;
      word-break:normal;
      flex:0 0 auto;
    }
    .modal-body{
      padding:38px;overflow:auto;max-height:92vh;
      display:flex;flex-direction:column;
    }
    .modal-kicker{
      text-transform:uppercase;letter-spacing:.16em;font-size:10px;
      color:#aaa;font-weight:900;margin-bottom:18px;
    }
    .modal-title{
      font-size:34px;line-height:.95;letter-spacing:-.045em;
      font-weight:950;margin:0 0 12px;
    }
    .modal-sub{
      color:#aaa;font-size:13px;line-height:1.45;margin:0 0 24px;
    }
    .modal .performance-list{
      max-height:none;overflow:visible;
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    .modal-footer{
      position:sticky;bottom:-1px;background:var(--ink);
      padding-top:22px;margin-top:18px;
      display:flex;align-items:center;gap:14px;
    }
    .picker{
      display:none;margin-top:18px;background:var(--ink);color:#fff;
      grid-template-columns:minmax(280px,.7fr) minmax(0,1.3fr);
      min-height:480px;overflow:hidden;
    }
    .picker.open{display:grid}
    .picker-visual{position:relative;min-height:470px;background:#242424}
    .picker-visual img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .picker-visual:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%);
    }
    .picker-name{
      position:absolute;z-index:2;left:28px;bottom:28px;right:28px;
      font-weight:950;letter-spacing:-.06em;font-size:clamp(34px,4vw,64px);
      line-height:.88;
    }
    .picker-body{padding:34px;display:flex;flex-direction:column}
    .picker-label{
      text-transform:uppercase;color:#a9a9a9;font-size:10px;
      letter-spacing:.16em;font-weight:900;margin-bottom:18px;
    }
    .performance-list{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;
      max-height:370px;overflow:auto;padding-right:4px;
    }
    .performance-option{
      min-height:84px;border:1px solid rgba(255,255,255,.24);
      background:transparent;color:white;padding:14px;text-align:left;
      display:flex;flex-direction:column;justify-content:space-between;
      transition:.15s ease;
    }
    .performance-option:hover{border-color:#fff}
    .performance-option.selected{
      background:var(--red);border-color:var(--red);
      box-shadow:inset 0 0 0 2px var(--red);
    }
    .performance-option.selected:after{
      content:"✓ VALITUD";
      font-size:9px;letter-spacing:.12em;font-weight:900;margin-top:8px;
    }
    .perf-date{font-size:17px;font-weight:900;letter-spacing:-.025em}
    .perf-status{
      font-size:9px;text-transform:uppercase;letter-spacing:.12em;
      font-weight:900;opacity:.72;
    }
    .picker-footer{
      margin-top:auto;padding-top:24px;display:flex;gap:12px;align-items:center;
    }
    .watch-btn{
      border:0;background:var(--red);color:#fff;border-radius:999px;
      padding:15px 24px;font-weight:900;text-transform:uppercase;
      letter-spacing:.08em;font-size:11px;min-width:190px;
    }
    .watch-btn:disabled{background:#484848;color:#858585;cursor:not-allowed}
    .picker-msg{font-size:13px;color:#aaa}
    .tracker-grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
    }
    .tracker-card{
      position:relative;min-height:430px;background:#161616;color:white;
      overflow:hidden;border-radius:4px;
    }
    .tracker-card img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    }
    .tracker-card:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.08) 65%);
    }
    .tracker-inner{
      position:absolute;z-index:2;inset:0;padding:22px;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .status-pill{
      align-self:flex-start;background:rgba(255,255,255,.94);color:#111;
      border-radius:999px;padding:8px 11px;font-size:9px;
      text-transform:uppercase;letter-spacing:.11em;font-weight:900;
      display:flex;align-items:center;gap:7px;
    }
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .status-dot.error{background:var(--red)}
    .tracker-title{
      margin:0 0 8px;font-size:clamp(27px,3vw,44px);
      line-height:.9;letter-spacing:-.06em;font-weight:950;
    }
    .tracker-date{font-size:15px;font-weight:800;margin-bottom:16px}
    .tracker-meta{font-size:11px;color:#d6d6d6;margin-bottom:17px}
    .tracker-actions{
      display:flex;align-items:center;justify-content:space-between;
      border-top:1px solid rgba(255,255,255,.35);padding-top:15px;
    }
    .external{font-size:11px;font-weight:900;text-transform:uppercase;text-decoration:none}
    .remove{
      border:0;background:transparent;color:#d7d7d7;font-size:11px;
      text-decoration:underline;text-underline-offset:4px;
    }
    .empty-state{
      padding:55px 0;font-size:28px;font-weight:900;letter-spacing:-.04em;
      color:#77716a;
    }
    .auth-page{
      min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;
      background:var(--ink);
    }
    .auth-art{
      min-height:100vh;padding:50px;display:flex;flex-direction:column;
      justify-content:space-between;background:var(--red);color:white;
    }
    .auth-art h1{
      margin:0;font-size:clamp(58px,8vw,120px);line-height:.79;
      letter-spacing:-.085em;font-weight:950;max-width:720px;
    }
    .auth-art h1 .hero-sentence{
      display:block;
    }
    .auth-art h1 .hero-second{
      margin-top:.38em;
    }
    .auth-art .logo{color:white}
    .auth-caption{max-width:430px;font-size:15px;line-height:1.45}
    .auth-panel{
      min-height:100vh;background:var(--paper);padding:50px;
      display:flex;align-items:center;justify-content:center;
    }
    .auth-box{width:min(100%,520px)}
    .auth-kicker{
      text-transform:uppercase;letter-spacing:.15em;color:var(--red);
      font-size:10px;font-weight:900;margin-bottom:18px;
    }
    .auth-box h2{
      margin:0 0 12px;font-size:52px;line-height:.9;
      letter-spacing:-.065em;font-weight:950;
    }
    .auth-copy{margin:0 0 30px;color:var(--muted);line-height:1.5}
    .field{margin-bottom:17px}
    .field label{
      display:block;text-transform:uppercase;letter-spacing:.12em;
      font-size:9px;font-weight:900;margin-bottom:8px;
    }
    .field input{
      width:100%;height:55px;border:1px solid var(--ink);background:transparent;
      border-radius:0;padding:0 14px;outline:none;
    }
    .field input:focus{box-shadow:inset 0 -3px 0 var(--red)}
    .auth-primary{
      width:100%;height:56px;border:0;border-radius:999px;
      background:var(--ink);color:#fff;font-weight:900;text-transform:uppercase;
      letter-spacing:.08em;font-size:11px;margin-top:6px;
    }
    .auth-links{
      display:flex;justify-content:space-between;gap:12px;margin-top:18px;
      font-size:12px;color:var(--muted);
    }
    .check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
    .check-row input{width:16px;height:16px}
    .auth-flashes{margin-bottom:18px}
    @media(max-width:1100px){
      .production-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .tracker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .picker{grid-template-columns:1fr}.picker-visual{min-height:340px}
      .hero{grid-template-columns:1fr}.hero-copy{max-width:620px}
    }
    @media(max-width:900px){
      .modal{grid-template-columns:1fr;overflow:auto}
      .modal-visual{min-height:0}
      .modal-body{max-height:none}
    }
    @media(max-width:760px){
      .production-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tracker-grid{grid-template-columns:1fr}
      .performance-list{grid-template-columns:1fr}
      .auth-page{grid-template-columns:1fr}
      .auth-art{min-height:42vh;padding:28px}
      .auth-panel{min-height:58vh;padding:28px}
      .account-label{display:none}
    }
  
    /* v25 brand + multi-theatre ready redesign */
    :root{
      --paper:#f5f1ea;
      --paper-2:#fcfaf6;
      --ink:#101113;
      --red:#d93646;
      --red-dark:#b82634;
      --white:#fff;
      --muted:#655f59;
      --line:rgba(16,17,19,.10);
      --surface:rgba(255,255,255,.72);
      --surface-strong:#fffdf9;
      --shadow:0 22px 60px rgba(17,17,18,.08);
      --radius:28px;
    }
    body{
      background:
        radial-gradient(circle at top left, rgba(217,54,70,.12), transparent 28%),
        radial-gradient(circle at top right, rgba(16,17,19,.05), transparent 26%),
        linear-gradient(180deg, #f7f2eb 0%, #f1ede6 100%);
    }
    .topbar{
      max-width:1500px;
      width:calc(100% - (2 * clamp(18px,4vw,58px)));
      margin:18px auto 0;
      padding:0 22px;
      min-height:76px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(16,17,19,.9);
      color:#fff;
      box-shadow:0 20px 50px rgba(16,17,19,.24);
    }
    .logo{color:#fff;gap:12px}
    .logo-mark{display:none}
    .logo-icon{width:36px;height:36px;display:block;flex:0 0 36px}
    .logo-stack{display:flex;flex-direction:column;line-height:1;gap:3px}
    .logo-stack strong{font-size:18px;font-weight:950;letter-spacing:-.05em}
    .logo-stack small{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.62)}
    .main-nav a{color:rgba(255,255,255,.76)}
    .main-nav a:hover,.main-nav a.active{background:#fff;color:var(--ink)}
    .account-label{color:rgba(255,255,255,.68)}
    .nav-btn{border-color:rgba(255,255,255,.2);color:#fff}
    .main{padding-top:22px;padding-bottom:84px}
    .hero,
    .section{
      background:var(--surface);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.48);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hero{padding:44px;border-bottom:0}
    .section{padding:38px;border-bottom:0;margin-top:20px}
    .hero h1{max-width:900px}
    .hero-copy{font-size:17px;max-width:460px;color:#342f2b}
    .hero-side{display:flex;flex-direction:column;gap:16px;align-self:stretch}
    .hero-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .hero-chip,
    .stat-chip{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:999px;background:#fff;
      border:1px solid rgba(16,17,19,.08);font-size:12px;font-weight:800;
      letter-spacing:-.01em;margin:10px 10px 0 0;
    }
    .stat-card{
      padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.82);
      border:1px solid rgba(16,17,19,.08);
    }
    .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:900;margin-bottom:8px}
    .stat-value{font-size:28px;line-height:.95;letter-spacing:-.05em;font-weight:950;margin:0 0 6px}
    .stat-note{font-size:13px;color:var(--muted);line-height:1.4}
    .section-title-row{margin-bottom:20px}
    .section-note{font-size:14px}
    .catalog-toolbar,
    .tracker-toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
    .filter-bar{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(180px,.55fr)) auto;gap:12px;align-items:end}
    .filter-group{display:flex;flex-direction:column;gap:7px}
    .filter-group.filter-grow{grid-column:auto}
    .filter-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--muted)}
    .filter-control{
      width:100%;height:52px;padding:0 14px;border-radius:14px;
      border:1px solid rgba(16,17,19,.12);background:rgba(255,255,255,.92);
      color:var(--ink);outline:none;
    }
    .filter-control:focus{border-color:rgba(217,54,70,.5);box-shadow:0 0 0 4px rgba(217,54,70,.08)}
    .filter-reset{
      height:52px;padding:0 18px;border-radius:14px;border:1px solid rgba(16,17,19,.12);
      background:var(--ink);color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em
    }
    .filter-help{font-size:13px;color:var(--muted);line-height:1.45}
    .grid-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .grid-count{font-size:13px;color:var(--muted)}
    .production-grid{gap:14px}
    .production-card,.tracker-card{border-radius:20px;box-shadow:0 18px 38px rgba(16,17,19,.08)}
    .production-card img{transition:transform .35s ease, filter .35s ease}
    .production-card:hover img{transform:scale(1.02);filter:saturate(1.03)}
    .production-content{left:18px;right:18px;bottom:17px}
    .production-index{font-size:10px;letter-spacing:.12em;opacity:.96;margin-bottom:8px}
    .production-meta{display:block;font-size:12px;font-weight:800;margin-top:8px;color:rgba(255,255,255,.88)}
    .production-grid .production-graphic{background:linear-gradient(180deg,#d9d5cf 0%, #c9c3bb 100%)}
    .catalog-empty{padding:24px 0;font-size:14px;color:var(--muted)}
    .tracker-grid{gap:14px}
    .tracker-card{min-height:420px}
    .tracker-title{margin-top:12px}

    /* European date picker: Monday first, Sunday last. */
    .eu-date-wrap{position:relative;width:100%}
    .eu-date-input{cursor:pointer;background:rgba(255,255,255,.92)}
    .eu-calendar{
      position:absolute;z-index:120;top:calc(100% + 8px);right:0;
      width:300px;padding:14px;border-radius:16px;background:#fff;
      border:1px solid rgba(16,17,19,.12);
      box-shadow:0 18px 48px rgba(17,17,18,.16);
      display:none;color:#161619;
    }
    .eu-calendar.open{display:block}
    .eu-cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .eu-cal-title{font-size:14px;font-weight:700;text-transform:capitalize}
    .eu-cal-nav{width:34px;height:34px;border:1px solid rgba(16,17,19,.10);border-radius:10px;background:#f5f2ed;color:#111;font-size:18px}

    .eu-cal-footer{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #eee9e2}
    .eu-cal-link{border:0;background:transparent;color:#5d5750;font-size:11px;font-weight:700;padding:4px}

<body>
{% block layout %}
<div class="site">
  {% block body %}{% endblock %}
</div>
{% endblock %}

<script>
(() => {
  const MONTHS = [
    "jaanuar","veebruar","märts","aprill","mai","juuni",
    "juuli","august","september","oktoober","november","detsember"
  ];
  const WEEKDAYS = ["E","T","K","N","R","L","P"];

  function pad(n){ return String(n).padStart(2,"0"); }
  function isoDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function displayDate(iso){
    if (!iso) return "";
    const [y,m,d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  function parseIso(iso){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return null;
    const [y,m,d] = iso.split("-").map(Number);
    return new Date(y,m-1,d);
  }
  function mondayIndex(jsDay){ return (jsDay + 6) % 7; }

  function enhance(input){
    if (!input || input.dataset.euReady === "1") return;
    input.dataset.euReady = "1";
    input.readOnly = true;
    input.setAttribute("inputmode","none");
    input.setAttribute("autocomplete","off");

    const wrap = document.createElement("div");
    wrap.className = "eu-date-wrap";
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const cal = document.createElement("div");
    cal.className = "eu-calendar";
    wrap.appendChild(cal);

    let current = parseIso(input.dataset.iso) || new Date();
    current = new Date(current.getFullYear(), current.getMonth(), 1);

    function close(){ cal.classList.remove("open"); }
    function setValue(iso){
      input.dataset.iso = iso;
      input.value = displayDate(iso);
      input.dispatchEvent(new Event("change", {bubbles:true}));
      close();
    }
    function render(){
      const y = current.getFullYear();
      const m = current.getMonth();
      const first = new Date(y,m,1);
      const gridStart = new Date(y,m,1 - mondayIndex(first.getDay()));
      const selected = input.dataset.iso || "";
      const today = new Date();
      const todayIso = isoDate(today.getFullYear(),today.getMonth(),today.getDate());

      cal.innerHTML = "";
      const head = document.createElement("div");
      head.className = "eu-cal-head";
      const prev = document.createElement("button");
      prev.type = "button"; prev.className = "eu-cal-nav"; prev.textContent = "‹";
      const title = document.createElement("div");
      title.className = "eu-cal-title"; title.textContent = `${MONTHS[m]} ${y}`;
      const next = document.createElement("button");
      next.type = "button"; next.className = "eu-cal-nav"; next.textContent = "›";
      prev.addEventListener("click", e => { e.stopPropagation(); current = new Date(y,m-1,1); render(); });
      next.addEventListener("click", e => { e.stopPropagation(); current = new Date(y,m+1,1); render(); });
      head.append(prev,title,next); cal.appendChild(head);

      const grid = document.createElement("div");
      grid.className = "eu-cal-grid";
      WEEKDAYS.forEach(label => {
        const el = document.createElement("div"); el.className="eu-cal-weekday"; el.textContent=label; grid.appendChild(el);
      });
      for (let i=0;i<42;i++){
        const date = new Date(gridStart); date.setDate(gridStart.getDate()+i);
        const iso = isoDate(date.getFullYear(),date.getMonth(),date.getDate());
        const btn = document.createElement("button");
        btn.type="button"; btn.className="eu-cal-day"; btn.textContent=String(date.getDate());
        if (date.getMonth() !== m) btn.classList.add("other");
        if (iso === selected) btn.classList.add("selected");
        if (iso === todayIso) btn.classList.add("today");
        btn.addEventListener("click", e => { e.stopPropagation(); setValue(iso); });
        grid.appendChild(btn);
      }
      cal.appendChild(grid);

      const footer = document.createElement("div"); footer.className="eu-cal-footer";
      const clear = document.createElement("button"); clear.type="button"; clear.className="eu-cal-link"; clear.textContent="Tühjenda";
      const todayBtn = document.createElement("button"); todayBtn.type="button"; todayBtn.className="eu-cal-link"; todayBtn.textContent="Täna";
      clear.addEventListener("click", e => { e.stopPropagation(); setValue(""); });
      todayBtn.addEventListener("click", e => { e.stopPropagation(); setValue(todayIso); });
      footer.append(clear,todayBtn); cal.appendChild(footer);
    }

    input.addEventListener("click", e => {
      e.stopPropagation();
      document.querySelectorAll(".eu-calendar.open").forEach(other => { if (other !== cal) other.classList.remove("open"); });
      render(); cal.classList.toggle("open");
    });
    cal.addEventListener("click", e => e.stopPropagation());
  }

  document.querySelectorAll(".eu-date-input").forEach(enhance);
  document.addEventListener("click", () => document.querySelectorAll(".eu-calendar.open").forEach(cal => cal.classList.remove("open")));
})();
</script>

</body>
</html>
