<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efede8">
  <title>{% block title %}Linnateater Tracker{% endblock %}</title>
  <style>
    :root{
      --paper:#efede8;
      --paper-2:#e8e5de;
      --ink:#0a0a0a;
      --red:#ee2b35;
      --white:#fff;
      --muted:#69655f;
      --line:rgba(10,10,10,.18);
      --green:#167347;
      --orange:#b45b18;
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper)}
    body{
      margin:0;background:var(--paper);color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    button,input{font:inherit}
    button{cursor:pointer}
    .site{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;
      min-height:78px;padding:0 clamp(18px,4vw,58px);
      background:rgba(239,237,232,.92);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(10,10,10,.22);
    }
    .logo{
      display:flex;align-items:center;gap:11px;text-decoration:none;
      font-weight:950;font-size:18px;letter-spacing:-.045em;
    }
    .logo-mark{
      width:30px;height:30px;background:var(--red);border-radius:50%;
      display:grid;place-items:center;color:#fff;font-weight:950;
    }
    .top-actions{display:flex;align-items:center;gap:14px}
    .main-nav{display:flex;align-items:center;gap:4px}
    .main-nav a{
      text-decoration:none;padding:10px 13px;border-radius:999px;
      font-size:11px;font-weight:900;text-transform:uppercase;
      letter-spacing:.07em;
    }
    .main-nav a:hover,.main-nav a.active{background:var(--ink);color:#fff}
    .nav-count{
      display:inline-grid;place-items:center;min-width:19px;height:19px;
      padding:0 5px;border-radius:999px;background:var(--red);color:#fff;
      margin-left:5px;font-size:9px;
    }
    .account-label{font-size:12px;color:var(--muted)}
    .nav-btn{
      border:1px solid var(--ink);background:transparent;color:var(--ink);
      border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;
    }
    .main{
      max-width:1500px;margin:0 auto;
      padding:0 clamp(18px,4vw,58px) 80px;
    }
    .hero{
      display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);
      gap:50px;align-items:end;padding:62px 0 58px;
      border-bottom:1px solid var(--ink);
    }
    .kicker{
      text-transform:uppercase;letter-spacing:.17em;font-size:11px;
      font-weight:900;color:var(--red);margin-bottom:17px;
    }
    .hero h1{
      margin:0;font-size:clamp(58px,8.5vw,132px);
      line-height:.79;letter-spacing:-.085em;font-weight:950;
      max-width:1000px;
    }
    .hero-copy{
      font-size:18px;line-height:1.45;letter-spacing:-.02em;
      max-width:410px;margin:0 0 7px;
    }
    .hero-copy strong{font-weight:900}
    .flash-stack{margin-top:24px}
    .flash{
      padding:15px 18px;border:1px solid var(--ink);
      background:#fff;margin-bottom:10px;font-size:14px;
      display:flex;gap:10px;align-items:center;
    }
    .flash:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
    .flash.success:before{background:var(--green)}
    .flash.notice:before{background:var(--orange)}
    .section{
      padding:54px 0;border-bottom:1px solid var(--ink);
    }
    .section-title-row{
      display:flex;align-items:end;justify-content:space-between;gap:20px;
      margin-bottom:24px;
    }
    .section-title{
      margin:0;font-size:clamp(34px,4vw,58px);
      line-height:.92;letter-spacing:-.06em;font-weight:950;
    }
    .section-note{font-size:13px;color:var(--muted);max-width:360px;line-height:1.45}
    .search-row{
      display:flex;align-items:center;gap:12px;margin-bottom:24px;
    }
    .search{
      width:100%;height:54px;background:transparent;border:0;
      border-bottom:1px solid var(--ink);border-radius:0;padding:0 2px;
      font-size:19px;outline:none;
    }
    .production-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
    }
    .production-card{
      position:relative;aspect-ratio:.78;overflow:hidden;border:0;padding:0;
      background:#d8d4cd;text-align:left;color:#fff;border-radius:4px;
      transform:translateZ(0);
    }
    .production-card[hidden]{display:none}
    .production-card img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      transition:transform .35s ease;
    }
    .production-card:hover img{transform:scale(1.025)}
    .production-card:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.86) 4%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.04));
    }
    .production-card.active{
      outline:5px solid var(--red);outline-offset:-5px;
    }
    .production-graphic{
      position:absolute;inset:0;display:grid;place-items:center;
      color:#77716a;background:#d8d4cd;
      font-size:clamp(58px,7vw,105px);line-height:1;
      letter-spacing:-.09em;font-weight:950;
    }
    .production-content{
      position:absolute;z-index:2;left:18px;right:18px;bottom:17px;
    }
    .production-index{
      display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
      font-weight:900;margin-bottom:8px;opacity:.78;
    }
    .production-title{
      display:block;font-size:clamp(19px,2vw,31px);line-height:.95;
      letter-spacing:-.05em;font-weight:950;
    }
    .image-skeleton{
      position:absolute;inset:0;background:#242424;
    }

    .modal-backdrop{
      position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
      display:none;align-items:center;justify-content:center;
      padding:22px;backdrop-filter:blur(8px);
    }
    .modal-backdrop.open{display:flex}
    .modal{
      position:relative;width:min(1120px,96vw);max-height:92vh;
      background:var(--ink);color:#fff;overflow:hidden;
      display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);
      box-shadow:0 40px 120px rgba(0,0,0,.38);
    }
    .modal-close{
      position:absolute;z-index:5;top:15px;right:15px;
      width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.55);
      background:rgba(0,0,0,.28);color:#fff;font-size:22px;
      display:grid;place-items:center;
    }
    .modal-visual{
      position:relative;min-height:640px;background:#262626;overflow:hidden;
    }
    .modal-visual img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    }
    .modal-visual:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.84),rgba(0,0,0,.05) 58%);
    }
    .modal-name{
      position:absolute;z-index:2;left:28px;right:28px;bottom:28px;
      font-size:clamp(38px,5vw,72px);line-height:.86;
      letter-spacing:-.065em;font-weight:950;
    }
    .modal-body{
      padding:38px;overflow:auto;max-height:92vh;
      display:flex;flex-direction:column;
    }
    .modal-kicker{
      text-transform:uppercase;letter-spacing:.16em;font-size:10px;
      color:#aaa;font-weight:900;margin-bottom:18px;
    }
    .modal-title{
      font-size:34px;line-height:.95;letter-spacing:-.045em;
      font-weight:950;margin:0 0 12px;
    }
    .modal-sub{
      color:#aaa;font-size:13px;line-height:1.45;margin:0 0 24px;
    }
    .modal .performance-list{
      max-height:none;overflow:visible;
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    .modal-footer{
      position:sticky;bottom:-1px;background:var(--ink);
      padding-top:22px;margin-top:18px;
      display:flex;align-items:center;gap:14px;
    }
    .picker{
      display:none;margin-top:18px;background:var(--ink);color:#fff;
      grid-template-columns:minmax(280px,.7fr) minmax(0,1.3fr);
      min-height:480px;overflow:hidden;
    }
    .picker.open{display:grid}
    .picker-visual{position:relative;min-height:470px;background:#242424}
    .picker-visual img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .picker-visual:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%);
    }
    .picker-name{
      position:absolute;z-index:2;left:28px;bottom:28px;right:28px;
      font-weight:950;letter-spacing:-.06em;font-size:clamp(34px,4vw,64px);
      line-height:.88;
    }
    .picker-body{padding:34px;display:flex;flex-direction:column}
    .picker-label{
      text-transform:uppercase;color:#a9a9a9;font-size:10px;
      letter-spacing:.16em;font-weight:900;margin-bottom:18px;
    }
    .performance-list{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;
      max-height:370px;overflow:auto;padding-right:4px;
    }
    .performance-option{
      min-height:84px;border:1px solid rgba(255,255,255,.24);
      background:transparent;color:white;padding:14px;text-align:left;
      display:flex;flex-direction:column;justify-content:space-between;
      transition:.15s ease;
    }
    .performance-option:hover{border-color:#fff}
    .performance-option.selected{
      background:var(--red);border-color:var(--red);
      box-shadow:inset 0 0 0 2px var(--red);
    }
    .performance-option.selected:after{
      content:"✓ VALITUD";
      font-size:9px;letter-spacing:.12em;font-weight:900;margin-top:8px;
    }
    .perf-date{font-size:17px;font-weight:900;letter-spacing:-.025em}
    .perf-status{
      font-size:9px;text-transform:uppercase;letter-spacing:.12em;
      font-weight:900;opacity:.72;
    }
    .picker-footer{
      margin-top:auto;padding-top:24px;display:flex;gap:12px;align-items:center;
    }
    .watch-btn{
      border:0;background:var(--red);color:#fff;border-radius:999px;
      padding:15px 24px;font-weight:900;text-transform:uppercase;
      letter-spacing:.08em;font-size:11px;min-width:190px;
    }
    .watch-btn:disabled{background:#484848;color:#858585;cursor:not-allowed}
    .picker-msg{font-size:13px;color:#aaa}
    .tracker-grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
    }
    .tracker-card{
      position:relative;min-height:430px;background:#161616;color:white;
      overflow:hidden;border-radius:4px;
    }
    .tracker-card img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    }
    .tracker-card:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.08) 65%);
    }
    .tracker-inner{
      position:absolute;z-index:2;inset:0;padding:22px;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .status-pill{
      align-self:flex-start;background:rgba(255,255,255,.94);color:#111;
      border-radius:999px;padding:8px 11px;font-size:9px;
      text-transform:uppercase;letter-spacing:.11em;font-weight:900;
      display:flex;align-items:center;gap:7px;
    }
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .status-dot.error{background:var(--red)}
    .tracker-title{
      margin:0 0 8px;font-size:clamp(27px,3vw,44px);
      line-height:.9;letter-spacing:-.06em;font-weight:950;
    }
    .tracker-date{font-size:15px;font-weight:800;margin-bottom:16px}
    .tracker-meta{font-size:11px;color:#d6d6d6;margin-bottom:17px}
    .tracker-actions{
      display:flex;align-items:center;justify-content:space-between;
      border-top:1px solid rgba(255,255,255,.35);padding-top:15px;
    }
    .external{font-size:11px;font-weight:900;text-transform:uppercase;text-decoration:none}
    .remove{
      border:0;background:transparent;color:#d7d7d7;font-size:11px;
      text-decoration:underline;text-underline-offset:4px;
    }
    .empty-state{
      padding:55px 0;font-size:28px;font-weight:900;letter-spacing:-.04em;
      color:#77716a;
    }
    .auth-page{
      min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;
      background:var(--ink);
    }
    .auth-art{
      min-height:100vh;padding:50px;display:flex;flex-direction:column;
      justify-content:space-between;background:var(--red);color:white;
    }
    .auth-art h1{
      margin:0;font-size:clamp(58px,8vw,120px);line-height:.79;
      letter-spacing:-.085em;font-weight:950;max-width:720px;
    }
    .auth-art h1 .hero-sentence{
      display:block;
    }
    .auth-art h1 .hero-second{
      margin-top:.58em;
    }
    .auth-art .logo{color:white}
    .auth-caption{max-width:430px;font-size:15px;line-height:1.45}
    .auth-panel{
      min-height:100vh;background:var(--paper);padding:50px;
      display:flex;align-items:center;justify-content:center;
    }
    .auth-box{width:min(100%,520px)}
    .auth-kicker{
      text-transform:uppercase;letter-spacing:.15em;color:var(--red);
      font-size:10px;font-weight:900;margin-bottom:18px;
    }
    .auth-box h2{
      margin:0 0 12px;font-size:52px;line-height:.9;
      letter-spacing:-.065em;font-weight:950;
    }
    .auth-copy{margin:0 0 30px;color:var(--muted);line-height:1.5}
    .field{margin-bottom:17px}
    .field label{
      display:block;text-transform:uppercase;letter-spacing:.12em;
      font-size:9px;font-weight:900;margin-bottom:8px;
    }
    .field input{
      width:100%;height:55px;border:1px solid var(--ink);background:transparent;
      border-radius:0;padding:0 14px;outline:none;
    }
    .field input:focus{box-shadow:inset 0 -3px 0 var(--red)}
    .auth-primary{
      width:100%;height:56px;border:0;border-radius:999px;
      background:var(--ink);color:#fff;font-weight:900;text-transform:uppercase;
      letter-spacing:.08em;font-size:11px;margin-top:6px;
    }
    .auth-links{
      display:flex;justify-content:space-between;gap:12px;margin-top:18px;
      font-size:12px;color:var(--muted);
    }
    .check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
    .check-row input{width:16px;height:16px}
    .auth-flashes{margin-bottom:18px}
    @media(max-width:1100px){
      .production-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .tracker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .picker{grid-template-columns:1fr}.picker-visual{min-height:340px}
      .hero{grid-template-columns:1fr}.hero-copy{max-width:620px}
    }
    @media(max-width:900px){
      .modal{grid-template-columns:1fr;overflow:auto}
      .modal-visual{min-height:300px}
      .modal-body{max-height:none}
    }
    @media(max-width:760px){
      .production-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tracker-grid{grid-template-columns:1fr}
      .performance-list{grid-template-columns:1fr}
      .auth-page{grid-template-columns:1fr}
      .auth-art{min-height:42vh;padding:28px}
      .auth-panel{min-height:58vh;padding:28px}
      .account-label{display:none}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block layout %}
<div class="site">
  {% block body %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
